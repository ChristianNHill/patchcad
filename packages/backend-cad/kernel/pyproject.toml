[project]
name = "patchcad-kernel"
version = "0.1.0"
description = "PatchCAD geometry kernel: build123d execution service with worker isolation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "build123d>=0.8",
    "trimesh>=4.5",
    "manifold3d>=3.0",
    "numpy>=1.26",
    "rtree>=1.4.1",
    "shapely>=2.1.2",
    "networkx>=3.6.1",
    "fast-simplification>=0.2.0",
    "bd-warehouse>=0.3.0",
    "pillow>=12.3.0",
    "lxml>=6.1.1",
]

[project.scripts]
patchcad-kernel = "patchcad_kernel.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchcad_kernel"]

[dependency-groups]
dev = ["httpx>=0.27", "ruff>=0.6"]
